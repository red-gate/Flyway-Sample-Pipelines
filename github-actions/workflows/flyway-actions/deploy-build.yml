name: Flyway GitHub Actions Build Workflow # Workflow name
# Uses the official Redgate actions (red-gate/setup-flyway + red-gate/flyway-actions).
# No pre-installed Flyway CLI needed - setup-flyway downloads and licenses it per job.
# For the equivalent pipeline calling a pre-installed Flyway CLI, see the flyway-cli folder.
on:
  push:
    branches:
      - Development
    paths:
      - "migrations/**"

# Environment Variables
env:
  # Repository Variables - Create these in Settings > Secrets and variables > Actions > Variables
  EMAIL: ${{ vars.USER_EMAIL }} # Email registered to your Flyway license
  JDBC_BUILD: ${{ vars.JDBC_BUILD }} # e.g. jdbc:sqlserver://<host>;databaseName=<BuildDB>;trustServerCertificate=true
  JDBC_QA: ${{ vars.JDBC_QA }} # Target of the pre-deployment check report
  JDBC_CHECK: ${{ vars.JDBC_CHECK }} # Throwaway build DB used by the check report - wiped every run

  # Repository Secrets - Create these in Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }} # Flyway license token (PAT)
  DB_USER_BUILD: ${{ secrets.DB_USER_BUILD }}
  DB_USER_PW_BUILD: ${{ secrets.DB_USER_PW_BUILD }}
  DB_USER_QA: ${{ secrets.DB_USER_QA }}
  DB_USER_PW_QA: ${{ secrets.DB_USER_PW_QA }}
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}
  FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }} # Validates all undo scripts down to and including this version

# Required so the code review results can be uploaded to GitHub Code Scanning
permissions:
  contents: read
  security-events: write

jobs:
  flyway-build:
    runs-on: self-hosted
    steps: # Steps run strictly in order and stop on the first failure
      - name: Checkout Repository # Checks out the commit that triggered this run
        uses: actions/checkout@v5
        with:
          clean: true # Ensure the workspace is cleaned before the workflow runs

      # NOTE: Windows runners only - not required on Linux runners, where bash is native.
      # Git for Windows' default install puts only Git\cmd on PATH (git.exe, no bash.exe),
      # so `shell: bash` inside the Flyway actions resolves to WSL's bash, which cannot
      # read the Windows script path. This puts Git Bash ahead of it.
      - name: Add Git Bash to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\Git\usr\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      # Installs the Flyway CLI on the runner and adds it to PATH
      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0" # Pin for reproducible runs - bump deliberately
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      # reprovision runs the 'clean' provisioner on the build environment first,
      # so this cleans and rebuilds the Build DB from scratch in one step.
      # Requires [environments.build] with provisioner = "clean" in flyway.toml.
      - name: Migrate Build
        uses: red-gate/flyway-actions/migrations/deploy@v2
        with:
          target-environment: build
          target-url: ${{ env.JDBC_BUILD }}
          target-user: ${{ env.DB_USER_BUILD }}
          target-password: ${{ env.DB_USER_PW_BUILD }}
          provision-mode: reprovision
          extra-args: -environments.build.flyway.cleanDisabled=false # Allow clean on Build only
          skip-drift-check: true # Build DB is rebuilt each run, so drift is meaningless
          skip-snapshot: true

      # Validates the undo scripts by rolling back what we just deployed
      - name: Rollback Build
        uses: red-gate/flyway-actions/migrations/undo@v2
        with:
          target-environment: build
          target-url: ${{ env.JDBC_BUILD }}
          target-user: ${{ env.DB_USER_BUILD }}
          target-password: ${{ env.DB_USER_PW_BUILD }}
          target-migration-version: ${{ env.FIRST_UNDO_SCRIPT }}
          skip-drift-check: true
          skip-snapshot: true

      # Pre-deployment check report against QA, for review during the pull request.
      # Code analysis, changes, drift and dry run all run by default - no flags needed.
      # The report is uploaded as a workflow artifact automatically.
      # Runs last, so only after the build migrate/rollback steps have passed.
      - name: Create QA Check Report
        uses: red-gate/flyway-actions/migrations/checks@v2
        with:
          target-url: ${{ env.JDBC_QA }}
          target-user: ${{ env.DB_USER_QA }}
          target-password: ${{ env.DB_USER_PW_QA }}
          build-environment: check
          build-url: ${{ env.JDBC_CHECK }}
          build-user: ${{ env.DB_USER_CHECK }}
          build-password: ${{ env.DB_USER_PW_CHECK }}
          build-ok-to-erase: true # Check DB is a throwaway shadow, cleaned each run
          fail-on-drift: false # Surface drift in the report rather than failing the build
          pre-deployment-report-name: flyway-qa-pre-deployment-report
