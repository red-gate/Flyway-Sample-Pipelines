name: Flyway GitHub Actions Build Workflow # Workflow name
# Uses the Flyway CLI pre-installed on the self-hosted runner.
# For the equivalent pipeline built on the official Redgate actions
# (red-gate/setup-flyway + red-gate/flyway-actions), see the flyway-actions folder.
on:
  push:
    branches:
      - Development
    paths:
      - "migrations/**"

# Environment Variables
env:
  # Repository Variables - Create these in Settings > Secrets and variables > Actions > Variables
  EMAIL: ${{ vars.USER_EMAIL }} # Email registered to your Flyway license
  JDBC_BUILD: ${{ vars.JDBC_BUILD }} # e.g. jdbc:sqlserver://<host>;databaseName=<BuildDB>;trustServerCertificate=true
  JDBC_QA: ${{ vars.JDBC_QA }} # Target of the pre-deployment check report
  JDBC_CHECK: ${{ vars.JDBC_CHECK }} # Throwaway build DB used by the check report - wiped every run

  # Repository Secrets - Create these in Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }} # Flyway license token (PAT)
  DB_USER_BUILD: ${{ secrets.DB_USER_BUILD }}
  DB_USER_PW_BUILD: ${{ secrets.DB_USER_PW_BUILD }}
  DB_USER_QA: ${{ secrets.DB_USER_QA }}
  DB_USER_PW_QA: ${{ secrets.DB_USER_PW_QA }}
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}
  FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }} # Validates all undo scripts down to and including this version

# jobs are the steps executed in the workflow
jobs:
  flyway-build: # Job name
    runs-on: self-hosted # Runner to execute the job
    # runs-on: ubuntu-latest
    defaults:
      run:
        shell: cmd # Default shell. Use Windows Command Prompt. bash for linux.
    steps: # Steps run strictly in order and stop on the first failure
      - name: Checkout Repository # Checks out the commit that triggered this run
        uses: actions/checkout@v5
        with:
          clean: true # Ensure the workspace is cleaned before the workflow runs

      # Runs the Flyway Clean command against the Build database.
      # -cleanDisabled=false is passed only on this step - clean stays disabled everywhere else.
      - name: Clean Build DB
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} info clean info -cleanDisabled="false" -user=${{ env.DB_USER_BUILD }} -password=${{ env.DB_USER_PW_BUILD }} -url=${{ env.JDBC_BUILD }} -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-

      - name: Migrate Build # Applies all pending migrations from scratch
        # To use username and password instead of windows integrated security, ensure SQL Server is configured to allow SQL Server authentication. In SSMS check Server Properties > Security and select "SQL Server and Windows Authentication mode".
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} migrate -user=${{ env.DB_USER_BUILD }} -password=${{ env.DB_USER_PW_BUILD }} -url=${{ env.JDBC_BUILD }} -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-

      - name: Rollback Build # Validates the undo scripts by rolling back what we just deployed
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} undo -user=${{ env.DB_USER_BUILD }} -password=${{ env.DB_USER_PW_BUILD }} -url=${{ env.JDBC_BUILD }} -target=${{ env.FIRST_UNDO_SCRIPT }} -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-

      # Pre-deployment check report against QA, for review during the pull request.
      # -code    static code analysis      -changes  deployment changes vs build DB
      # -drift   schema drift vs snapshot  -dryrun   SQL that would run against QA
      # cleanDisabled is scoped to the throwaway check environment - QA is never clean-enabled.
      - name: Create QA Check Report
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} check -code -changes -drift -dryrun -user=${{ env.DB_USER_QA }} -password=${{ env.DB_USER_PW_QA }} -url=${{ env.JDBC_QA }} -environments.check.user=${{ env.DB_USER_CHECK }} -environments.check.password=${{ env.DB_USER_PW_CHECK }} -environments.check.url="${{ env.JDBC_CHECK }}" -environments.check.flyway.cleanDisabled=false -check.buildEnvironment="check" -reportFilename="${{ github.workspace }}\reports\QA-Run-${{ github.run_id }}-Check-Report.html" -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-

      # The CLI does not upload reports automatically - publish them as a workflow artifact.
      # if: always() uploads the report even when the check step fails - that is
      # when you most need to read it. warn surfaces a missing report.
      - name: Publish QA Check Report as Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flyway-qa-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn
