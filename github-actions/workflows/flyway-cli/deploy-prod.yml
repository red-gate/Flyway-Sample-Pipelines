name: Flyway GitHub Actions Production Workflow # Workflow name
# Uses the Flyway CLI pre-installed on the self-hosted runner.
# For the equivalent pipeline built on the official Redgate actions
# (red-gate/setup-flyway + red-gate/flyway-actions), see the flyway-actions folder.
on:
  push:
    branches:
      - Production
    paths:
      - "migrations/**"

# Environment Variables
env:
  # Repository Variables - Create these in Settings > Secrets and variables > Actions > Variables
  EMAIL: ${{ vars.USER_EMAIL }} # Email registered to your Flyway license
  JDBC_PROD1: ${{ vars.JDBC_PROD1 }} # e.g. jdbc:sqlserver://<host>;databaseName=<Prod1DB>;trustServerCertificate=true
  JDBC_PROD2: ${{ vars.JDBC_PROD2 }}
  JDBC_CHECK: ${{ vars.JDBC_CHECK }} # Throwaway build DB used by the check report - wiped every run

  # Repository Secrets - Create these in Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }} # Flyway license token (PAT)
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}
  DB_USER_PROD1: ${{ secrets.DB_USER_PROD1 }}
  DB_USER_PW_PROD1: ${{ secrets.DB_USER_PW_PROD1 }}
  DB_USER_PROD2: ${{ secrets.DB_USER_PROD2 }}
  DB_USER_PW_PROD2: ${{ secrets.DB_USER_PW_PROD2 }}
  # End of Environment Secrets #

# jobs are the steps executed in the workflow
jobs:
  flyway-report:
    name: Generate Report
    runs-on: self-hosted # Runner to execute the job
    defaults:
      run:
        shell: cmd # Default shell. Use Windows Command Prompt. bash for linux.

    steps: # Steps run strictly in order and stop on the first failure
      - uses: actions/checkout@v5 # Checks out the commit that triggered this run

      # Pre-deployment check report against PROD2, for review before the deploy jobs run.
      # -code    static code analysis      -changes  deployment changes vs build DB
      # -drift   schema drift vs snapshot  -dryrun   SQL that would run against PROD
      # cleanDisabled is scoped to the throwaway check environment - PROD is never clean-enabled.
      - name: Create Drift and Change Report
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} check -code -changes -drift -dryrun -user=${{ env.DB_USER_PROD2 }} -password=${{ env.DB_USER_PW_PROD2 }} -url=${{ env.JDBC_PROD2 }} -environments.check.user=${{ env.DB_USER_CHECK }} -environments.check.password=${{ env.DB_USER_PW_CHECK }} -environments.check.url="${{ env.JDBC_CHECK }}" -environments.check.flyway.cleanDisabled=false -check.buildEnvironment="check" -reportFilename="${{ github.workspace }}\reports\Prod-Run-${{ github.run_id }}-Check-Report.html" -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-
        continue-on-error: true # Report must never block the deploy jobs

      # The CLI does not upload reports automatically - publish them as a workflow artifact.
      # if: always() uploads the report even when the check step fails - that is
      # when you most need to read it. warn surfaces a missing report.
      - name: Publish Check Report as Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flyway-prod-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn

  # GitHub Actions can support manual approval steps like some other CI/CD tools (e.g., Azure DevOps or GitLab).
  # You can achieve similar functionality using environments with required reviewers or by integrating external approval mechanisms.
  # Alternatively maybe a Review Branch prior to pulling to Production or another downstream environment.

  # Prod 1 and Prod 2 are separate simultaneous jobs; both wait for the report job.
  flyway-deploy-prod-1:
    name: Flyway Deploy Production 1
    runs-on: self-hosted # Runner to execute the job
    defaults:
      run:
        shell: cmd # Default shell. Use Windows Command Prompt. bash for linux.
    needs: flyway-report # This job depends on the completion of the flyway-report job

    steps: # Steps run strictly in order and stop on the first failure
      - uses: actions/checkout@v5 # Checks out the commit that triggered this run

      - name: Deploy Prod 1 # Applies pending migrations
        # To use username and password instead of windows integrated security, ensure SQL Server is configured to allow SQL Server authentication. In SSMS check Server Properties > Security and select "SQL Server and Windows Authentication mode".
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} migrate -user=${{ env.DB_USER_PROD1 }} -password=${{ env.DB_USER_PW_PROD1 }} -url=${{ env.JDBC_PROD1 }} -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-

  flyway-deploy-prod-2:
    name: Flyway Deploy Production 2
    runs-on: self-hosted # Runner to execute the job
    defaults:
      run:
        shell: cmd # Default shell. Use Windows Command Prompt. bash for linux.
    needs: flyway-report # This job depends on the completion of the flyway-report job

    steps: # Steps run strictly in order and stop on the first failure
      - uses: actions/checkout@v5 # Checks out the commit that triggered this run

      # Multi-tenant deployment. PROD 2
      - name: Deploy Prod 2 # Applies pending migrations, with info before and after
        run: flyway -email=${{ env.EMAIL }} -token=${{ env.TOKEN }} info migrate info -user=${{ env.DB_USER_PROD2 }} -password=${{ env.DB_USER_PW_PROD2 }} -url=${{ env.JDBC_PROD2 }} -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-
        # Multi-tenant deployment. Add further tenant deployments here

        # Sample for integrated security instead of user name and password
        # -url="jdbc:sqlserver://<host>;databaseName=<ProdDB>;integratedSecurity=true;trustServerCertificate=true"
