parameters:
  - name: stageName
    type: string
    default: CheckReport

  - name: displayName
    type: string
    default: "Flyway check report"

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: succeeded()

  # Variable group holding target_database_JDBC, databaseName, userName, password for the
  # database the report is run against.
  - name: credentialsGroup
    type: string

  # Short label used in the artifact name and report headings, e.g. test1.
  - name: environmentLabel
    type: string

  # Commit to check. Dev runs pass the commit Generate ended on, as a runtime expression such as
  # $[ coalesce(stageDependencies.GenerateMigration.Generate.outputs['Push.ValidatedSha'], variables['Build.SourceVersion']) ].
  # This stage re-publishes it as the output Pin.Sha, which later stages pin to.
  - name: commit
    type: string
    default: $(Build.SourceVersion)

  # false (default): code analysis findings are flagged as warnings on the run and listed in the
  #                  report, and the deployment carries on.
  # true:            error-level findings also fail this stage, which stops the deployment.
  - name: failOnCodeError
    type: boolean
    default: false

  # Most findings raised as individual warnings on the run; the rest are summed up in one more
  # warning. All of them are always in the report.
  - name: maxCodeWarnings
    type: number
    default: 25

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      - group: ${{ parameters.credentialsGroup }}
      - name: CheckDir
        value: $(Build.ArtifactStagingDirectory)\check-${{ parameters.environmentLabel }}
    jobs:
      - job: Check
        displayName: "check -dryrun -code against ${{ parameters.environmentLabel }}"
        variables:
          - name: PinnedCommit
            value: ${{ parameters.commit }}
        steps:
          - checkout: self
            clean: true
            persistCredentials: true

          - template: steps-checkout-commit.yml
            parameters:
              commit: $(PinnedCommit)

          - powershell: |
              Write-Host "##vso[task.setvariable variable=Sha;isOutput=true]$env:PINNED_COMMIT"
              New-Item -ItemType Directory -Force -Path "$(CheckDir)" | Out-Null
            name: Pin
            displayName: "Publish the pinned commit for later stages"
            env:
              PINNED_COMMIT: $(PinnedCommit)

          - template: steps-resolve-auth.yml
            parameters:
              environmentName: target
              outputVariable: TargetAuth

          # -dryrun: the SQL the next deployment to this database would run.
          # -code:   static code analysis of the migrations that are pending on it.
          # Writes <name>.html, <name>.json and <name>-code-review.sarif.
          - script: |
              flyway -configFiles=flyway.toml $(TargetAuth) -environment=target ^
                check -dryrun -code ^
                -check.code.failOnError=${{ lower(parameters.failOnCodeError) }} ^
                -reportFilename="$(CheckDir)\${{ parameters.environmentLabel }}-check.html"
            displayName: "flyway check -dryrun -code: $(databaseName)"
            env:
              environments_target_url: $(target_database_JDBC)

          # Markdown summary on the run's Summary tab, plus warnings for code analysis findings.
          - template: steps-check-summary.yml
            parameters:
              label: ${{ parameters.environmentLabel }}
              reportDir: $(CheckDir)
              artifactName: check-report-${{ parameters.environmentLabel }}
              failOnCodeError: ${{ parameters.failOnCodeError }}
              maxCodeWarnings: ${{ parameters.maxCodeWarnings }}

          # Build Artifacts, not the `publish:` shortcut: Pipeline Artifacts are not supported on Azure DevOps Server.
          - task: PublishBuildArtifacts@1
            displayName: "Publish the check report"
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(CheckDir)
              ArtifactName: check-report-${{ parameters.environmentLabel }}
              publishLocation: Container
