parameters:
  - name: stageName
    type: string

  - name: jobName
    type: string

  - name: displayName
    type: string

  - name: dependsOn
    type: object

  - name: adoEnvironment
    type: string

  - name: credentialsGroup
    type: string

  # Commit to deploy. Defaults to the commit that triggered the run (right for release runs).
  # Dev runs pass the commit pinned by the check stage, a runtime expression such as
  # $[ stageDependencies.CheckTest1.Check.outputs['Pin.Sha'] ].
  - name: commit
    type: string
    default: $(Build.SourceVersion)

  - name: condition
    type: string
    default: succeeded()

  # Pre-deployment reports (see steps-deploy-checks.yml): flyway check -drift -code -changes
  # -dryrun plus a flyway info migrations report, as HTML and JSON in the artifact
  # check-report-<reportLabel>, a summary on the run and warnings for drift and code findings.
  - name: checkReport
    type: boolean
    default: false

  # Short name for the report files and artifact, e.g. test or prod. Required with checkReport.
  - name: reportLabel
    type: string
    default: ''

  # Variable group for the BUILD database the drift and change reports are worked out in
  # (build_database_JDBC, build_databaseName, build_userName, build_password). Flyway restores or
  # cleans it, so it must never be a real environment. Required with checkReport.
  - name: buildCredentialsGroup
    type: string
    default: ''

  # Schema-only backup the build database is restored from, and the version it holds (see
  # steps-build-provisioner.yml). Empty: Flyway cleans the build database instead.
  - name: baselineBackupPath
    type: string
    default: ''

  - name: baselineBackupVersion
    type: string
    default: ''

  # Report-only by default: drift and code analysis findings are flagged as warnings and the
  # deployment carries on. Set true to stop the deployment on drift / error-level findings.
  - name: failOnDrift
    type: boolean
    default: false

  - name: failOnCodeError
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      - group: ${{ parameters.credentialsGroup }}
      - ${{ if eq(parameters.checkReport, true) }}:
        - group: ${{ parameters.buildCredentialsGroup }}
        - name: CheckDir
          value: $(Build.ArtifactStagingDirectory)\check-${{ parameters.reportLabel }}
    jobs:
      - deployment: ${{ parameters.jobName }}
        environment: ${{ parameters.adoEnvironment }}
        variables:
          - name: PinnedCommit
            value: ${{ parameters.commit }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  persistCredentials: true

                - template: steps-checkout-commit.yml
                  parameters:
                    commit: $(PinnedCommit)

                - template: steps-resolve-auth.yml
                  parameters:
                    environmentName: target
                    outputVariable: TargetAuth

                # Before deploying: drift, changes, code analysis, dry run and migrations reports.
                - ${{ if eq(parameters.checkReport, true) }}:
                  - template: steps-deploy-checks.yml
                    parameters:
                      label: ${{ parameters.reportLabel }}
                      reportDir: $(CheckDir)
                      failOnDrift: ${{ parameters.failOnDrift }}
                      failOnCodeError: ${{ parameters.failOnCodeError }}
                      baselineBackupPath: ${{ parameters.baselineBackupPath }}
                      baselineBackupVersion: ${{ parameters.baselineBackupVersion }}

                # Without *:pending, validate fails on every not-yet-applied migration, so the gate
                # would only pass with nothing to do. It still catches checksum mismatches and
                # missing applied migrations. With outOfOrder=true in flyway.toml, migrations older
                # than the current version count as pending, so this does NOT flag them.
                - script: |
                    flyway -configFiles=flyway.toml $(TargetAuth) -environment=target validate -ignoreMigrationPatterns="*:pending"
                  displayName: "Pre-flight validate: $(databaseName)"
                  env:
                    environments_target_url: $(target_database_JDBC)

                - script: |
                    flyway -configFiles=flyway.toml $(TargetAuth) -environment=target migrate -baselineVersion=$(BASELINE_VERSION)
                  displayName: "Flyway migrate: $(databaseName)"
                  env:
                    environments_target_url: $(target_database_JDBC)
