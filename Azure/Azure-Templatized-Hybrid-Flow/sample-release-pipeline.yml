# RELEASE pipeline: runs when a PR from dev is merged into release.
#
#   Dry run UAT + Prod -> Deploy UAT -> Deploy Prod
#
# The BUILD pipeline (sample-build-pipeline.yml) opens that PR after the check report and the
# manual intervention, and the PR can only complete at the commit that run validated. Approving
# the PR is the only gate: this pipeline deploys straight through.
#
# Every stage deploys $(Build.SourceVersion), the merge commit that triggered the run.
#
# Server-side guard: the DistroUat and DistroProd environments and the uat/prod credential groups
# have a Branch control check (protected release branch only), so only this pipeline, running on
# release, can reach them.
#
# Variable groups (Pipelines > Library):
#   distro_pipeline_vars      BASELINE_VERSION, AGENT_POOL, SCHEMAS, LONG_LIVED_BRANCH
#   distro_uat_credentials    target_database_JDBC, databaseName, userName, password
#   distro_prod_credentials   target_database_JDBC, databaseName, userName, password

trigger:
  branches:
    include:
      - release

pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid

pool:
  name: Default

variables:
  - group: distro_pipeline_vars

  - name: DryRunDir
    value: $(Build.ArtifactStagingDirectory)\dry-run

stages:
  - stage: DryRun
    displayName: "Dry run: SQL UAT and Prod will get"
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/release')
    jobs:
      - template: job-dry-run.yml@templates
        parameters:
          jobName: DryRunUat
          displayName: "Dry run: uat"
          credentialsGroup: distro_uat_credentials

      - template: job-dry-run.yml@templates
        parameters:
          jobName: DryRunProd
          displayName: "Dry run: prod"
          credentialsGroup: distro_prod_credentials

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployUat
      jobName: MigrateUat
      displayName: "Deploy to UAT"
      dependsOn: DryRun
      adoEnvironment: DistroUat
      credentialsGroup: distro_uat_credentials

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployProd
      jobName: MigrateProd
      displayName: "Deploy to Prod"
      dependsOn: DeployUat
      adoEnvironment: DistroProd
      credentialsGroup: distro_prod_credentials
