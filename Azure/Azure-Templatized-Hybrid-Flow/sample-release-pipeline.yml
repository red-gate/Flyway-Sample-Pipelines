# 3. RELEASE: runs when the PR from dev is merged into main.
#
#   Deploy test  ->  Deploy prod
#
# Each deploy stage first reports on its database, as HTML + JSON in the artifact
# check-report-<test|prod>, with a summary on the run:
#   flyway check -drift -code -changes -dryrun   drift since the last deployment, the objects this
#                                                deployment changes, code analysis, the SQL it runs
#   flyway info                                  every migration and its state (<label>-migrations.*)
# Report only: drift and code analysis findings are flagged as warnings and the deployment carries
# on. Set failOnDrift / failOnCodeError to true on a stage to stop it instead.
#
# 2. INTEGRATION (sample-integration-pipeline.yml) opens that PR after the Flyway check report and
# the integration deploy. The PR can only complete at the commit that run validated. Approving the
# PR is the only gate: this pipeline deploys straight through.
#
# Every stage deploys $(Build.SourceVersion), the merge commit that triggered the run.
#
# Server-side guard: the northwind-hybrid-test and northwind-hybrid-prod environments and the test/prod credential groups
# have a Branch control check (protected main only), so only this pipeline, running on main, can
# reach them.
#
# Variable groups (Pipelines > Library):
#   northwind-hybrid-pipeline-vars      BASELINE_VERSION, AGENT_POOL, SCHEMAS, LONG_LIVED_BRANCH
#   northwind-hybrid-test-credentials   target_database_JDBC, databaseName, userName, password
#   northwind-hybrid-prod-credentials   target_database_JDBC, databaseName, userName, password
#   northwind-hybrid-check-credentials   build_database_JDBC, build_databaseName, build_userName, build_password
#                             (a scratch BUILD database for the drift and change reports; Flyway
#                             cleans it, so never point it at a real environment)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid

pool:
  name: Default

variables:
  - group: northwind-hybrid-pipeline-vars

stages:
  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployTest
      jobName: MigrateTest
      displayName: "Deploy to test"
      dependsOn: []
      adoEnvironment: northwind-hybrid-test
      credentialsGroup: northwind-hybrid-test-credentials
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
      checkReport: true
      reportLabel: test
      buildCredentialsGroup: northwind-hybrid-check-credentials

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployProd
      jobName: MigrateProd
      displayName: "Deploy to prod"
      dependsOn: DeployTest
      adoEnvironment: northwind-hybrid-prod
      credentialsGroup: northwind-hybrid-prod-credentials
      checkReport: true
      reportLabel: prod
      buildCredentialsGroup: northwind-hybrid-check-credentials
