# 3. RELEASE: runs when the PR from dev is merged into main.
#
#   Deploy test  ->  Deploy prod
#
# Each deploy stage first reports on its database, as HTML + JSON in the artifact
# check-report-<test|prod>, with a summary on the run:
#   flyway check -drift -code -changes -dryrun   drift since the last deployment, the objects this
#                                                deployment changes, code analysis, the SQL it runs
#   flyway info                                  every migration and its state (<label>-migrations.*)
# Report only: drift and code analysis findings are flagged as warnings and the deployment carries
# on. Set failOnDrift / failOnCodeError to true on a stage to stop it instead.
#
# 2. INTEGRATION (sample-integration-pipeline.yml) opens that PR after the Flyway check report and
# the integration deploy. The PR can only complete at the commit that run validated. Approving the
# PR is the only gate: this pipeline deploys straight through.
#
# Every stage deploys $(Build.SourceVersion), the merge commit that triggered the run.
#
# Server-side guard: the test and prod environments and credential groups have a Branch control
# check (protected main only), so only this pipeline, running on main, can reach them.
#
# Project-specific names live in pipeline-settings.yml. Variable groups used here (Pipelines > Library):
#   pipelineVarsGroup              BASELINE_VERSION
#   testCredentialsGroup           target_database_JDBC, databaseName, userName, password
#   prodCredentialsGroup           target_database_JDBC, databaseName, userName, password
#   releaseBuildCredentialsGroup   build_database_JDBC, build_databaseName, build_userName, build_password
#                                  (a scratch BUILD database for the drift and change reports; Flyway
#                                  restores the baseline backup over it, or cleans it, so never point
#                                  it at a real environment)

# --- Per project, and can't be variables (keep in step with pipeline-settings.yml) ---------------
# Also set the pipeline's default branch to main. That's a pipeline setting, not YAML (see README).
trigger:
  branches:
    include:
      - main                         # mainBranch

pr: none

pool:
  name: Default                      # agent pool with Flyway on it

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid  # templates repo
# --------------------------------------------------------------------------------------------------

variables:
  - template: pipeline-settings.yml
  - group: ${{ variables.pipelineVarsGroup }}

stages:
  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployTest
      jobName: MigrateTest
      displayName: "Deploy to test"
      dependsOn: []
      adoEnvironment: ${{ variables.testEnvironment }}
      credentialsGroup: ${{ variables.testCredentialsGroup }}
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/${{ variables.mainBranch }}')
      checkReport: true
      reportLabel: test
      buildCredentialsGroup: ${{ variables.releaseBuildCredentialsGroup }}
      baselineBackupPath: ${{ variables.baselineBackupPath }}
      baselineBackupVersion: ${{ variables.baselineBackupVersion }}

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployProd
      jobName: MigrateProd
      displayName: "Deploy to prod"
      dependsOn: DeployTest
      adoEnvironment: ${{ variables.prodEnvironment }}
      credentialsGroup: ${{ variables.prodCredentialsGroup }}
      checkReport: true
      reportLabel: prod
      buildCredentialsGroup: ${{ variables.releaseBuildCredentialsGroup }}
      baselineBackupPath: ${{ variables.baselineBackupPath }}
      baselineBackupVersion: ${{ variables.baselineBackupVersion }}
