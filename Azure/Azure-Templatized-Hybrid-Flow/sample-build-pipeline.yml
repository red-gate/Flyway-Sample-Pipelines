# BUILD pipeline: runs on every push to dev.
#
#   Generate migration -> Flyway check report (test1) -> Deploy test1 -> Manual intervention -> PR dev -> release
#
# Approving that PR merges it into release, which triggers the RELEASE pipeline (sample-release-pipeline.yml).
#
# Every stage pins to one commit (the one Generate ends on), so the report, the test1 deploy and the
# PR all refer to the same code. The PR can only complete at that commit: the run posts a
# "flyway/validated" status for it, which a release branch policy requires and resets on every push.
#
# Variable groups (Pipelines > Library):
#   distro_pipeline_vars       BASELINE_VERSION, AGENT_POOL, SCHEMAS, LONG_LIVED_BRANCH
#   distro_build_credentials   target_database_JDBC, databaseName, userName, password  (the shadow/build database)
#   distro_test1_credentials   target_database_JDBC, databaseName, userName, password
# Leave userName and password empty to use integrated security from the JDBC url.

parameters:
  - name: skipGenerate
    displayName: "Skip migration generation (promote existing migrations only)"
    type: boolean
    default: false

  # Default must not be empty: ADO marks an empty-default string parameter
  # Required and greys out the Run button.
  - name: descriptionOverride
    displayName: "Migration description, or 'auto' to derive it from the merge commit"
    type: string
    default: auto

# Literal branch name on purpose: a runtime parameter would let a queued run retarget it.
trigger:
  branches:
    include:
      - dev

# No `pr:` trigger: ADO ignores it for Azure Repos Git. PR validation comes from a
# Build Validation branch policy on dev that points at this pipeline.

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid

pool:
  name: Default

variables:
  - group: distro_pipeline_vars

  - name: LongLivedBranch
    value: dev

stages:
  - template: stage-pr-review.yml@templates
    parameters:
      credentialsGroup: distro_build_credentials

  - template: stage-generate.yml@templates
    parameters:
      credentialsGroup: distro_build_credentials
      longLivedBranch: dev
      skipGenerate: ${{ parameters.skipGenerate }}
      descriptionOverride: ${{ parameters.descriptionOverride }}

  - template: stage-check-report.yml@templates
    parameters:
      stageName: CheckTest1
      displayName: "Flyway check report: test1"
      dependsOn: GenerateMigration
      credentialsGroup: distro_test1_credentials
      environmentLabel: test1
      # The commit Generate pushed, or the triggering commit when nothing was generated or Generate was skipped.
      commit: $[ coalesce(stageDependencies.GenerateMigration.Generate.outputs['Push.ValidatedSha'], variables['Build.SourceVersion']) ]
      condition: >-
        and(
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/dev'),
          in(dependencies.GenerateMigration.result, 'Succeeded', 'Skipped', 'SucceededWithIssues')
        )

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployTest1
      jobName: MigrateTest1
      displayName: "Deploy to test1"
      dependsOn: CheckTest1
      adoEnvironment: DistroTest1
      credentialsGroup: distro_test1_credentials
      commit: $[ stageDependencies.CheckTest1.Check.outputs['Pin.Sha'] ]

  - template: stage-promote.yml@templates
    parameters:
      stageName: PromoteToRelease
      displayName: "Manual intervention, then PR to release"
      dependsOn: [CheckTest1, DeployTest1]
      sourceBranch: dev
      targetBranch: release
      commit: $[ stageDependencies.CheckTest1.Check.outputs['Pin.Sha'] ]
      reportArtifact: check-report-test1
      notifyUsers: '[Distro]\Distro Team'                    # who is notified about the manual intervention
