# 1. GENERATE: runs when the schema model or the comparison settings (flyway.toml, Filter.scpf)
# change on dev. Not on migration changes: merging a review PR only starts 2. INTEGRATION.
#
#   Schema model ahead of migrations  ->  generate the versioned + undo scripts, open a review PR
#                                         into dev (edit the scripts on its branch, then approve)
#   Review PR already open            ->  add the new scripts to that PR (dev is merged into its
#                                         branch first, so only the difference is generated)
#   In sync                           ->  nothing to do
#
# Approving the review PR merges the scripts into dev, which triggers 2. INTEGRATION
# (sample-integration-pipeline.yml).
#
# Straight after the PR step, "➜ Link to the review PR" has the link in its log. The run title and
# a warning on the run summary say what to do next.
#
# Project-specific names live in pipeline-settings.yml. Variable groups used here (Pipelines > Library):
#   pipelineVarsGroup        BASELINE_VERSION
#   shadowCredentialsGroup   target_database_JDBC, databaseName, userName, password  (shadow database)

# --- Per project, and can't be variables (keep in step with pipeline-settings.yml) ---------------
# Also set the pipeline's default branch to dev. That's a pipeline setting, not YAML (see README).
trigger:
  branches:
    include:
      - dev                          # devBranch
  paths:
    include:
      - schema-model
      - flyway.toml
      - Filter.scpf

pool:
  name: Default                      # agent pool with Flyway on it

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid  # templates repo
# --------------------------------------------------------------------------------------------------

variables:
  - template: pipeline-settings.yml
  - group: ${{ variables.pipelineVarsGroup }}
  - name: LongLivedBranch
    value: ${{ variables.devBranch }}

parameters:
  # Default must not be empty: ADO marks an empty-default string parameter
  # Required and greys out the Run button.
  - name: descriptionOverride
    displayName: "Migration description, or 'auto' to derive it from the merge commit"
    type: string
    default: auto

# Stages are chosen at compile time, so a run only ever shows the stages it actually runs.
stages:
  # PR builds (Build Validation policy on dev): preview the migration this PR would generate.
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - template: stage-pr-review.yml@templates
      parameters:
        credentialsGroup: ${{ variables.shadowCredentialsGroup }}
        baselineBackupPath: ${{ variables.baselineBackupPath }}
        baselineBackupVersion: ${{ variables.baselineBackupVersion }}

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - template: stage-generate-review.yml@templates
      parameters:
        credentialsGroup: ${{ variables.shadowCredentialsGroup }}
        devBranch: ${{ variables.devBranch }}
        descriptionOverride: ${{ parameters.descriptionOverride }}
        baselineBackupPath: ${{ variables.baselineBackupPath }}
        baselineBackupVersion: ${{ variables.baselineBackupVersion }}
