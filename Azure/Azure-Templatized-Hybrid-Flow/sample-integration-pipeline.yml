# 2. INTEGRATION: runs on every change to dev except schema-model-only changes (those go to
# 1. GENERATE first). That covers new migrations from a merged review PR, and pipeline or config
# changes, so the PR to main always validates the latest dev.
#
#   Flyway check report (-dryrun -code) vs integration  ->  Deploy integration  ->  Open PR dev -> main
#
# Approving the dev -> main PR merges it, which triggers 3. RELEASE (sample-release-pipeline.yml):
# deploy test, then prod.
#
# Every stage pins to the commit that triggered the run, so the check report, the integration
# deploy and the PR all refer to the same code. The PR to main can only complete at that commit:
# the run posts a "flyway/validated" status for it, which a main branch policy requires and resets
# on every push.
#
# Straight after the PR step, "➜ Link to the pull request" has the link in its log. The run title
# and a warning on the run summary say what to do next.
#
# Variable groups used here (Pipelines > Library), named in the block below:
#   pipelineVarsGroup             BASELINE_VERSION
#   integrationCredentialsGroup   target_database_JDBC, databaseName, userName, password

# --- Per project: everything to change for another project ----------------------------------------
# The other two pipelines start with the same kind of block; keep the values they share in step.
# Also set the pipeline's default branch to dev. That's a pipeline setting, not YAML (see README).
# Exclude-only path filter: any push to dev runs this, unless every changed file is in schema-model/.
trigger:
  branches:
    include:
      - dev                          # = devBranch (trigger, pool and templates repo can't use variables)
  paths:
    exclude:
      - schema-model

pool:
  name: Default                      # agent pool with Flyway on it

resources:
  repositories:
    - repository: templates
      type: git
      name: flyway-templates-hybrid  # templates repo

variables:
  - name: projectName                # the group and environment names below follow from it
    value: northwind
  - name: devBranch
    value: dev
  - name: mainBranch
    value: main
  - name: pipelineVarsGroup
    value: ${{ variables.projectName }}_pipeline_vars
  - name: integrationCredentialsGroup
    value: ${{ variables.projectName }}_integration_credentials
  - name: integrationEnvironment     # Pipelines > Environments
    value: ${{ variables.projectName }}-integration
  # ------------------------------------------------------------------------------------------------
  - group: ${{ variables.pipelineVarsGroup }}

stages:
  - template: stage-check-report.yml@templates
    parameters:
      stageName: CheckIntegration
      displayName: "Flyway check report: integration"
      credentialsGroup: ${{ variables.integrationCredentialsGroup }}
      environmentLabel: integration
      # Code analysis findings are flagged as warnings on the run and listed in the report
      # (HTML + JSON artifact, run summary, PR description). They never stop the deployment.
      # Set to true to fail the check, and stop the deployment, on error-level findings.
      failOnCodeError: false
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/${{ variables.devBranch }}')

  - template: stage-deploy.yml@templates
    parameters:
      stageName: DeployIntegration
      jobName: MigrateIntegration
      displayName: "Deploy to integration"
      dependsOn: CheckIntegration
      adoEnvironment: ${{ variables.integrationEnvironment }}
      credentialsGroup: ${{ variables.integrationCredentialsGroup }}
      commit: $[ stageDependencies.CheckIntegration.Check.outputs['Pin.Sha'] ]

  - template: stage-promote.yml@templates
    parameters:
      stageName: PromoteToMain
      displayName: "Open PR ${{ variables.devBranch }} -> ${{ variables.mainBranch }}"
      dependsOn: [CheckIntegration, DeployIntegration]
      sourceBranch: ${{ variables.devBranch }}
      targetBranch: ${{ variables.mainBranch }}
      commit: $[ stageDependencies.CheckIntegration.Check.outputs['Pin.Sha'] ]
      reportArtifact: check-report-integration
      manualReview: false
      environmentLabel: integration
      deploysTo: "test and then prod"
