# Deploy migrations to the QA DB, then report on Production. See README.md.

name: Flyway Azure DevOps QA Pipeline

trigger:
  branches:
    include:
      - qa
  paths:
    include:
      - migrations/*

pool:
  name: $(AGENT_POOL)

# All values come from variable groups in Pipelines > Library.
# See INSTRUCTIONS.md for the keys each group needs.
variables:
  - group: newworlddb_pipeline_vars # AGENT_POOL, BASELINE_VERSION, FIRST_UNDO_SCRIPT
  - group: redgate_global_vars # FLYWAY_EMAIL, FLYWAY_TOKEN
  - group: newworlddb_qa_credentials # qa_database_JDBC, qa_userName, qa_password

  - name: FLYWAY
    value: >-
      flyway -email="$(FLYWAY_EMAIL)" -token="$(FLYWAY_TOKEN)"
      -locations="filesystem:$(Build.SourcesDirectory)\migrations"
      -configFiles="$(Build.SourcesDirectory)\flyway.toml"
      -baselineOnMigrate=true -baselineVersion=$(BASELINE_VERSION)
      -errorOverrides=S0001:0:I-

  # Blank this out to use Windows integrated security instead - see README.md
  - name: QA_LOGIN
    value: -user="$(qa_userName)" -password="$(qa_password)"

  # --- PRODUCTION REPORT - comment out this block to disable ----------------
  - group: newworlddb_prod_credentials # prod_database_JDBC, prod_userName, prod_password
  - group: newworlddb_check_credentials # check_database_JDBC, check_userName, check_password

  - name: PROD_LOGIN
    value: -user="$(prod_userName)" -password="$(prod_password)"
  - name: CHECK_LOGIN
    value: -environments.check.user="$(check_userName)" -environments.check.password="$(check_password)"
  # --- END PRODUCTION REPORT ------------------------------------------------

stages:
  - stage: DeployQA
    displayName: Deploy QA
    jobs:
      - job: DeployQA
        displayName: Deploy QA
        steps:
          - checkout: self
            clean: true

          - script: $(FLYWAY) $(QA_LOGIN) info migrate info -url="$(qa_database_JDBC)"
            displayName: Deploy QA
            env:
              FLYWAY_CLEAN_DISABLED: true

  # --- PRODUCTION REPORT - comment out this block to disable ----------------
  # Promotion preview for the reviewer of the pull request into prod.
  # Nothing is deployed to Production here.
  - stage: Report
    displayName: Production Check Report
    dependsOn: DeployQA
    jobs:
      - job: ProductionCheckReport
        displayName: Production Check Report
        steps:
          - checkout: self
            clean: true

          - script: >-
              $(FLYWAY) $(PROD_LOGIN) $(CHECK_LOGIN)
              check -code -changes -drift -dryrun -url="$(prod_database_JDBC)"
              -environments.check.url="$(check_database_JDBC)"
              -environments.check.flyway.cleanDisabled=false
              -check.buildEnvironment="check"
              -reportFilename="$(System.ArtifactsDirectory)\Prod-$(Build.BuildId)-Check-Report.html"
            displayName: Production Check Report
            env:
              FLYWAY_CLEAN_DISABLED: true
              FLYWAY_ENV_NATIVE_SQLFLUFF: true

          # =================================================================
          # ON-PREM ONLY. PublishBuildArtifacts is required by Azure DevOps
          # Server. On Azure DevOps Services (cloud), comment this task out and
          # uncomment the PublishPipelineArtifact version below. Running
          # PublishPipelineArtifact on-prem fails with "Pipeline Artifact Task
          # is not supported in on-premises."
          # =================================================================
          - task: PublishBuildArtifacts@1
            displayName: Publish Production Check Report
            condition: always()
            inputs:
              ArtifactName: prod-check-report
              PathtoPublish: $(System.ArtifactsDirectory)

          # CLOUD (Azure DevOps Services) equivalent - unsupported on-prem:
          # - task: PublishPipelineArtifact@1
          #   displayName: Publish Production Check Report
          #   condition: always()
          #   inputs:
          #     artifactName: prod-check-report
          #     targetPath: $(System.ArtifactsDirectory)
  # --- END PRODUCTION REPORT ------------------------------------------------
